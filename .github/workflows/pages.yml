name: Publish free offline game
on:
  push:
    branches: [codex/city-border-v0.2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Record built revision
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          writeFileSync('dist/build-info.json', JSON.stringify({ version, revision: process.env.GITHUB_SHA }) + '\n');
          NODE
      - name: Prepare Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages-site"
          cp dist/city-border.html dist/build-info.json "$RUNNER_TEMP/pages-site/"
          cat > "$RUNNER_TEMP/pages-site/index.html" <<'HTML'
          <!doctype html>
          <html lang="ko"><meta charset="utf-8"><title>도시 경계</title>
          <script>location.replace('./city-border.html'+location.search+location.hash);</script>
          <a href="./city-border.html">게임 열기</a></html>
          HTML
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: pages
      # Finish an active publication; keep only the latest queued update.
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          # deploy-pages enforces a maximum of ten minutes per deployment.
          timeout: '600000'
      - name: Verify published revision
        env:
          PUBLISHED_PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { setTimeout as wait } from 'node:timers/promises';
          const pageURL = new URL(process.env.PUBLISHED_PAGE_URL);
          let reason = 'The published revision has not appeared yet.';
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const infoURL = new URL('build-info.json', pageURL);
              infoURL.searchParams.set('check', `${process.env.EXPECTED_REVISION}-${Date.now()}`);
              const response = await fetch(infoURL, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              if (!response.ok) throw new Error(`Build information returned HTTP ${response.status}.`);
              const info = await response.json();
              if (info.revision !== process.env.EXPECTED_REVISION) throw new Error('Pages still serves a different revision.');
              for (const target of [pageURL, new URL('city-border.html', pageURL)]) {
                const page = await fetch(target, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
                await page.body?.cancel();
                if (!page.ok) throw new Error(`The game page returned HTTP ${page.status}.`);
              }
              console.log(`Verified published game revision ${info.revision} (v${info.version}).`);
              process.exit(0);
            } catch (error) {
              reason = error.message;
              console.log(`Publication check ${attempt + 1}/12: ${reason}`);
            }
            if (attempt < 11) await wait(5000);
          }
          throw new Error(reason);
          NODE
