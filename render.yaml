services:
  - type: web
    name: city-border
    runtime: node
    plan: free
    branch: codex/city-border-v0.2
    buildCommand: npm ci
    startCommand: npm run online
    healthCheckPath: /api/online
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
